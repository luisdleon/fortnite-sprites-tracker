<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d16">
<title>Espíritus Fortnite · Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/Spiritsapplogo.png">
<link rel="apple-touch-icon" href="assets/img/Spiritsapplogo.png">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <img src="assets/img/fortnite-logo-transparent.png" alt="Fortnite" class="hero-logo">
    <div class="hero-subtitle">ESPÍRITUS · TRACKER</div>

    <div id="userSection" class="user-section">
      <form id="userForm" class="user-form">
        <input id="usernameInput" type="text" placeholder="Tu nombre de jugador..." maxlength="24" autocomplete="off">
        <button type="submit" class="btn-user-save">Guardar</button>
      </form>
      <div id="userGreeting" class="user-greeting hidden">
        <span class="user-greeting-text">Hola, <strong id="userNameDisplay"></strong></span>
        <button id="editUserBtn" class="btn-user-edit" title="Cambiar nombre">✏️</button>
      </div>
    </div>
  </div>
</section>

<header class="topbar">
  <div class="topbar-title">
    <button id="avatarBtn" class="avatar-btn" title="Cambiar foto de perfil">
      <img id="avatarImg" class="avatar-img hidden" alt="Foto de perfil">
      <span id="avatarPlaceholder" class="avatar-placeholder">+</span>
    </button>
    <h1 id="pageTitle">Espíritus</h1>
  </div>
  <button id="exportBtn" class="btn-export" title="Compartir lista como imagen">
    <span class="label">Comparte</span>
  </button>
</header>

<nav class="tabs">
  <button id="tabMine" class="tab active" data-view="mine">Mis Espíritus</button>
  <button id="tabFriends" class="tab" data-view="friends">Intercambios</button>
</nav>

<section id="viewMine">
<section class="progress-panel">
  <div class="progress-stats">
    <div class="stat">
      <span id="ownedCount">0</span> / <span id="totalCount">117</span>
      <small>Conseguidos</small>
    </div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div class="stat stat-mastered">
      <span id="masteredCount">0</span> / <span id="totalCountMastered">117</span>
      <small>Dominados</small>
    </div>
    <div class="progress-bar">
      <div id="progressFillMastered" class="progress-fill progress-fill-mastered"></div>
    </div>
  </div>
</section>

<section class="controls">
  <input id="searchInput" type="search" placeholder="Buscar espíritu..." autocomplete="off">
  <div class="dropdown-row">
    <select id="rarityFilter" class="dropdown"></select>
    <select id="masteredFilter" class="dropdown">
      <option value="">Dominado: Todos</option>
      <option value="yes">Solo dominados</option>
      <option value="no">Solo no dominados</option>
    </select>
  </div>
  <div class="toggle-row">
    <button id="showAllBtn" class="chip active" data-mode="all">Todos</button>
    <button id="showOwnedBtn" class="chip" data-mode="owned">Conseguidos</button>
    <button id="showMissingBtn" class="chip" data-mode="missing">Faltantes</button>
  </div>
</section>

<main id="grid" class="grid"></main>
</section>

<section id="viewFriends" class="hidden">
  <div class="friends-panel">
    <form id="addFriendForm" class="friend-form">
      <input id="friendInput" type="text" placeholder="Nombre de tu amigo..." maxlength="24" autocomplete="off">
      <button type="submit" class="btn-user-save">Agregar</button>
    </form>
    <div id="friendsList" class="friends-list"></div>
  </div>

  <div id="tradeArea" class="trade-area hidden">
    <div class="trade-header">
      <span class="trade-with">Intercambio con <strong id="tradeFriendName"></strong></span>
      <button id="removeFriendBtn" class="btn-remove-friend">Quitar amigo</button>
    </div>

    <div class="toggle-row trade-tabs">
      <button class="chip active" data-trade="give">Le puedes dar (<span id="countGive">0</span>)</button>
      <button class="chip" data-trade="get">Te puede dar (<span id="countGet">0</span>)</button>
      <button class="chip" data-trade="his">Sus espíritus (<span id="countHis">0</span>)</button>
    </div>

    <p id="tradeHint" class="trade-hint"></p>
    <div id="tradeGrid" class="grid trade-grid"></div>
  </div>

  <div id="friendsEmpty" class="empty-state">
    Agrega a un amigo por su nombre de jugador para comparar espíritus.
  </div>
</section>

<div id="avatarModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>Foto de perfil</h2>
      <button id="avatarCloseBtn" class="btn-modal-close">✕</button>
    </div>
    <input id="avatarSearch" type="search" placeholder="Buscar espíritu..." autocomplete="off">
    <div id="avatarGrid" class="avatar-grid"></div>
    <button id="avatarRemoveBtn" class="btn-reset">Quitar foto</button>
  </div>
</div>

<footer class="footer">
  <button id="resetBtn" class="btn-reset">Reiniciar progreso</button>
  <span class="footer-note">Tu progreso se guarda en tu nombre de jugador</span>
</footer>

<div id="toast" class="toast"></div>

<canvas id="exportCanvas" style="display:none;"></canvas>

<script type="module" src="firebase-init.js?v=5"></script>
<script src="data.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
